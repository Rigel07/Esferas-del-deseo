name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descomprimir zip y localizar el proyecto
        run: |
          set -e
          ZIP=$(find . -type f -iname '*.zip' -not -path './_src/*' -not -path './.git/*' | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "Zip encontrado: $ZIP"
            mkdir -p _src
            unzip -o -q "$ZIP" -d _src
            SEARCH=_src
          else
            echo "No hay zip, se usa el contenido del repositorio"
            SEARCH=.
          fi
          SETTINGS=$(find "$SEARCH" -type f -name 'settings.gradle' -not -path '*/.git/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::No se encontro settings.gradle ni en el zip ni en el repositorio"
            find . -not -path './.git/*' | head -n 100
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Proyecto en: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          ls -la "$DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Build mod
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: wishspheres-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJECT_DIR }}/build/libs/*.jar
